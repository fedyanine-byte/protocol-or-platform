<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocol or Platform?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --burg: #5E012E;
      --burg-light: #8a1a4e;
      --tint: #F5ECF0;
      --grey: #595959;
      --black: #1a1a1a;
      --white: #ffffff;
      --green: #1a7a3c;
      --green-light: #d4edda;
      --blue: #0d3d6b;
      --blue-light: #d0e4f7;
      --amber: #8a5a00;
      --amber-light: #fff3cd;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #f8f4f6; color: var(--black); }

    /* ── LANDING ── */
    #landing { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; text-align:center; }
    #landing h1 { font-size:2.8rem; font-weight:800; color:var(--burg); margin-bottom:.5rem; line-height:1.1; }
    #landing .sub { font-size:1.1rem; color:var(--grey); margin-bottom:2.5rem; }
    .btn { display:inline-block; padding:.9rem 2.2rem; border-radius:8px; font-size:1.05rem; font-weight:700; cursor:pointer; border:none; transition:all .15s; }
    .btn-primary { background:var(--burg); color:white; }
    .btn-primary:hover { background:var(--burg-light); }
    .btn-secondary { background:white; color:var(--burg); border:2px solid var(--burg); margin-left:1rem; }
    .btn-secondary:hover { background:var(--tint); }
    .btn-big { font-size:1.3rem; padding:1.1rem 3rem; }

    /* ── JOIN SCREEN (student) ── */
    #join { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; text-align:center; }
    #join h2 { font-size:2rem; font-weight:800; color:var(--burg); margin-bottom:.5rem; }
    #join input { font-size:1.3rem; padding:.8rem 1.2rem; border:2.5px solid var(--burg); border-radius:8px; width:100%; max-width:340px; margin:1rem 0; text-align:center; outline:none; }
    #join input:focus { border-color:var(--burg-light); box-shadow:0 0 0 3px rgba(94,1,46,.15); }
    #join .err { color:#c0392b; font-size:.95rem; margin-top:.5rem; min-height:1.2rem; }

    /* ── WAITING ROOM ── */
    #waiting { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; text-align:center; }
    #waiting h2 { font-size:1.8rem; font-weight:800; color:var(--burg); }
    #waiting .team-badge { background:var(--burg); color:white; padding:.5rem 1.5rem; border-radius:20px; font-size:1.2rem; font-weight:700; margin:1rem 0; display:inline-block; }
    #waiting .pulse { font-size:1rem; color:var(--grey); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── VOTE SCREEN (student) ── */
    #vote { display:none; flex-direction:column; min-height:100vh; padding:1.5rem; }
    #vote .q-number { font-size:.85rem; font-weight:700; color:var(--burg); letter-spacing:.08em; text-transform:uppercase; }
    #vote .q-item { font-size:2rem; font-weight:800; color:var(--black); margin:.4rem 0; line-height:1.2; }
    #vote .q-hint { font-size:1rem; color:var(--grey); margin-bottom:1.5rem; font-style:italic; }
    .vote-btns { display:grid; grid-template-columns:1fr 1fr; gap:1rem; flex:1; }
    .vote-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:16px; font-size:2.2rem; font-weight:900; cursor:pointer; border:none; transition:transform .1s, box-shadow .1s; padding:1.5rem; }
    .vote-btn:active { transform:scale(.96); }
    .vote-btn.proto { background:var(--blue-light); color:var(--blue); }
    .vote-btn.plat  { background:var(--green-light); color:var(--green); }
    .vote-btn.grey-btn { background:#e8e8e8; color:#666; }
    .vote-btn span.label { font-size:1rem; font-weight:700; margin-top:.4rem; }
    .voted-msg { text-align:center; padding:3rem 1rem; }
    .voted-msg .big { font-size:3rem; margin-bottom:.5rem; }
    .voted-msg p { color:var(--grey); }

    /* ── REVEAL SCREEN (student) ── */
    #reveal-student { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; text-align:center; }
    .result-correct { background:var(--green-light); border:2px solid var(--green); border-radius:16px; padding:1.5rem; width:100%; max-width:400px; }
    .result-wrong   { background:#fde8e8; border:2px solid #c0392b; border-radius:16px; padding:1.5rem; width:100%; max-width:400px; }
    .result-neutral { background:var(--amber-light); border:2px solid var(--amber); border-radius:16px; padding:1.5rem; width:100%; max-width:400px; }
    .result-icon { font-size:3.5rem; margin-bottom:.5rem; }
    .result-label { font-size:1.3rem; font-weight:800; margin-bottom:.5rem; }
    .result-explanation { font-size:.95rem; color:var(--grey); line-height:1.5; }
    .score-chip { display:inline-block; background:var(--burg); color:white; padding:.3rem 1rem; border-radius:20px; font-weight:700; margin-top:1rem; }

    /* ── HOST SCREENS ── */
    #host-lobby, #host-question, #host-reveal, #host-final { display:none; flex-direction:column; min-height:100vh; padding:1.5rem 2rem; }

    /* host lobby */
    #host-lobby h1 { font-size:2.5rem; font-weight:900; color:var(--burg); }
    #host-lobby .url-box { background:white; border:2px solid var(--burg); border-radius:10px; padding:1rem 1.5rem; font-size:1.1rem; font-weight:700; color:var(--burg); margin:1rem 0; word-break:break-all; }
    #teams-grid { display:flex; flex-wrap:wrap; gap:.6rem; margin:1rem 0; }
    .team-chip { background:var(--tint); border:1.5px solid var(--burg); border-radius:20px; padding:.35rem .9rem; font-size:.95rem; font-weight:600; color:var(--burg); }

    /* host question */
    #host-question { background:var(--black); color:white; }
    #host-question .hq-meta { font-size:1rem; color:#aaa; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.5rem; }
    #host-question .hq-item { font-size:3.5rem; font-weight:900; line-height:1.1; margin-bottom:.3rem; }
    #host-question .hq-hint { font-size:1.3rem; color:#ccc; font-style:italic; margin-bottom:1.5rem; }
    .answer-split { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; flex:1; }
    .answer-col { border-radius:16px; padding:1.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .answer-col.proto-col { background:rgba(13,61,107,.25); border:2px solid rgba(13,61,107,.6); }
    .answer-col.plat-col  { background:rgba(26,122,60,.25); border:2px solid rgba(26,122,60,.6); }
    .answer-col.grey-col  { background:rgba(150,150,150,.15); border:2px solid rgba(150,150,150,.4); }
    .answer-col .col-label { font-size:1.1rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#aaa; margin-bottom:.5rem; }
    .answer-col .col-count { font-size:4rem; font-weight:900; }
    .answer-col .col-teams { font-size:.85rem; color:#bbb; margin-top:.3rem; max-width:100%; word-break:break-word; text-align:center; }
    .timer-bar-wrap { height:8px; background:#333; border-radius:4px; margin:1rem 0; overflow:hidden; }
    .timer-bar { height:100%; background:var(--burg); border-radius:4px; transition:width 1s linear; }

    /* host reveal */
    #host-reveal { background:#0f0f0f; color:white; }
    .reveal-answer-tag { display:inline-block; padding:.4rem 1.2rem; border-radius:20px; font-weight:800; font-size:1rem; margin-bottom:.8rem; }
    .tag-proto { background:var(--blue-light); color:var(--blue); }
    .tag-plat  { background:var(--green-light); color:var(--green); }
    .tag-grey  { background:var(--amber-light); color:var(--amber); }
    .reveal-item { font-size:2.8rem; font-weight:900; margin-bottom:.5rem; line-height:1.1; }
    .reveal-explanation { font-size:1.15rem; color:#ccc; line-height:1.6; margin-bottom:1rem; max-width:800px; }
    .reveal-discussion { background:rgba(94,1,46,.3); border-left:4px solid var(--burg); padding:1rem 1.2rem; border-radius:0 8px 8px 0; font-size:1rem; color:#ddd; line-height:1.5; margin-bottom:1.2rem; max-width:800px; }
    .reveal-discussion strong { color:white; }
    .scoreboard { display:flex; flex-direction:column; gap:.5rem; }
    .score-row { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,.06); border-radius:8px; padding:.5rem 1rem; }
    .score-row .sname { font-size:1rem; font-weight:600; }
    .score-row .spts  { font-size:1.1rem; font-weight:800; color:#f5c842; }
    .score-row.top { background:rgba(245,200,66,.15); border:1.5px solid rgba(245,200,66,.4); }

    /* host final */
    #host-final { background:#0f0f0f; color:white; align-items:center; justify-content:center; text-align:center; }
    #host-final h1 { font-size:3rem; font-weight:900; color:#f5c842; margin-bottom:.5rem; }
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:1rem; margin:2rem 0; }
    .podium-col { display:flex; flex-direction:column; align-items:center; }
    .podium-block { width:110px; border-radius:8px 8px 0 0; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:900; color:white; }
    .p1 { background:#f5c842; height:120px; color:#1a1a1a; }
    .p2 { background:#a0a0a0; height:85px; }
    .p3 { background:#cd7f32; height:60px; }
    .podium-name { font-size:.9rem; font-weight:700; margin-top:.5rem; text-align:center; max-width:110px; }
    .podium-pts  { font-size:.8rem; color:#aaa; }

    /* controls bar */
    .ctrl-bar { display:flex; gap:.8rem; margin-top:auto; padding-top:1rem; flex-wrap:wrap; }
    .ctrl-btn { padding:.7rem 1.5rem; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; border:none; }
    .ctrl-start { background:var(--burg); color:white; }
    .ctrl-next  { background:#1a7a3c; color:white; }
    .ctrl-reveal{ background:#0d3d6b; color:white; }
    .ctrl-reset { background:#555; color:white; }
    .ctrl-btn:hover { filter:brightness(1.15); }

    /* student final */
    #student-final { display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; text-align:center; }
    #student-final h2 { font-size:2rem; font-weight:800; color:var(--burg); }
    #student-final .final-score { font-size:4rem; font-weight:900; color:var(--burg); margin:.5rem 0; }
    #student-final .final-sub { color:var(--grey); margin-bottom:2rem; }
    .final-board { width:100%; max-width:400px; }
    .final-board .fr { display:flex; justify-content:space-between; padding:.5rem .8rem; border-radius:6px; margin:.25rem 0; font-weight:600; }
    .final-board .fr.me { background:var(--tint); border:1.5px solid var(--burg); }
  </style>
</head>
<body>
  <div id="landing">
    <h1>Protocol<br>or Platform?</h1>
    <p class="sub">RSU Digital Economy — Lecture 9</p>
    <div>
      <button class="btn btn-primary btn-big" onclick="showJoin()">Join as Team</button>
      <button class="btn btn-secondary btn-big" onclick="showHost()">Host View</button>
    </div>
  </div>

  <!-- STUDENT JOIN -->
  <div id="join">
    <h2>Enter your team name</h2>
    <p style="color:var(--grey);margin-bottom:1rem;">One person per team joins</p>
    <input id="team-input" type="text" placeholder="e.g. Team Ostrom" maxlength="24" autocomplete="off" />
    <div class="err" id="join-err"></div>
    <button class="btn btn-primary" style="margin-top:.5rem" onclick="joinGame()">Join →</button>
  </div>

  <!-- WAITING ROOM -->
  <div id="waiting">
    <div style="font-size:3rem;margin-bottom:.5rem">👋</div>
    <h2>You're in!</h2>
    <div class="team-badge" id="waiting-team"></div>
    <p class="pulse">Waiting for the host to start…</p>
  </div>

  <!-- VOTE -->
  <div id="vote">
    <div class="q-number" id="v-number"></div>
    <div class="q-item" id="v-item"></div>
    <div class="q-hint" id="v-hint"></div>
    <div class="vote-btns" id="vote-btns">
      <button class="vote-btn proto" onclick="castVote('P')">
        🔌
        <span class="label">Protocol</span>
      </button>
      <button class="vote-btn plat" onclick="castVote('PL')">
        🏰
        <span class="label">Platform</span>
      </button>
    </div>
  </div>

  <!-- REVEAL STUDENT -->
  <div id="reveal-student"></div>

  <!-- STUDENT FINAL -->
  <div id="student-final">
    <div style="font-size:3rem">🏆</div>
    <h2>Game Over!</h2>
    <div class="final-score" id="sf-score"></div>
    <div class="final-sub" id="sf-sub"></div>
    <div class="final-board" id="sf-board"></div>
  </div>

  <!-- HOST LOBBY -->
  <div id="host-lobby">
    <h1>Protocol or Platform?</h1>
    <p style="color:var(--grey);margin:.3rem 0 1rem">Share this URL with students:</p>
    <div class="url-box" id="join-url"></div>
    <p style="font-size:.9rem;color:var(--grey)">Teams joined (<span id="team-count">0</span>):</p>
    <div id="teams-grid"></div>
    <div class="ctrl-bar">
      <button class="ctrl-btn ctrl-start" onclick="hostStartGame()">▶ Start Game</button>
      <button class="ctrl-btn ctrl-reset" onclick="hostReset()">↺ Reset</button>
    </div>
  </div>

  <!-- HOST QUESTION -->
  <div id="host-question">
    <div class="hq-meta" id="hq-meta"></div>
    <div class="hq-item" id="hq-item"></div>
    <div class="hq-hint" id="hq-hint"></div>
    <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>
    <div class="answer-split" id="answer-split"></div>
    <div class="ctrl-bar">
      <button class="ctrl-btn ctrl-reveal" onclick="hostReveal()">🔍 Reveal Answer</button>
    </div>
  </div>

  <!-- HOST REVEAL -->
  <div id="host-reveal"></div>

  <!-- HOST FINAL -->
  <div id="host-final">
    <div style="font-size:3rem;margin-bottom:.5rem">🎓</div>
    <h1>Final Standings</h1>
    <div class="podium" id="podium"></div>
    <div class="scoreboard" id="final-board" style="width:100%;max-width:600px;margin:0 auto"></div>
    <div class="ctrl-bar" style="justify-content:center;margin-top:2rem">
      <button class="ctrl-btn ctrl-reset" onclick="hostReset()">↺ New Game</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
